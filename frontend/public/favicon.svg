<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- anillos de mira (target) -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#f87171" stroke-width="2.5" opacity="0.9"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#f87171" stroke-width="2.5" opacity="0.55"/>

  <!-- lineas de mira (crosshair) -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>

  <!-- rayo de velocidad/reaccion en el centro -->
  <path d="M34.5 14 L22 34 H30.5 L28 50 L43 28 H34.5 Z"
        fill="url(#bolt)" stroke="#052e16" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
