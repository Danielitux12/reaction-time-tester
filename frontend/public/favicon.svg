<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="60%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Gradient: Cyan Neon Edge -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Primary Neon Gradient -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0084ff" />
    </linearGradient>

    <!-- Star Core Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0faff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Core Ambient Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sleek Dark Squircle Plate -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Outer Precision Reticle Ring (4 Symmetrical Arcs) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#primaryNeon)" stroke-width="2.6" stroke-dasharray="21.42 10.00" stroke-dashoffset="5.00" stroke-linecap="round" />

  <!-- Inner Concentric Sight Guide -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3" />

  <!-- 4 Cardinal Crosshair Pointers -->
  <line x1="32" y1="5" x2="32" y2="13" stroke="url(#primaryNeon)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="32" y1="51" x2="32" y2="59" stroke="url(#primaryNeon)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="5" y1="32" x2="13" y2="32" stroke="url(#primaryNeon)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="51" y1="32" x2="59" y2="32" stroke="url(#primaryNeon)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Ambient Light Pulse -->
  <circle cx="32" cy="32" r="13" fill="url(#coreGlow)" />

  <!-- Precision Reflex 4-Point Star -->
  <path d="M32 18 Q32 32 46 32 Q32 32 32 46 Q32 32 18 32 Q32 32 32 18 Z" fill="url(#starGrad)" />

  <!-- Pinpoint Laser Sight Core -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
</svg>
